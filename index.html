<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>物件相場ウォッチ（家族用）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 一列の作業台。上に状態バー、タブで「通知履歴／物件一覧／気になる／相場／設定」を切り替え。 */
:root {
  --paper: #ffffff;
  --sheet: #ffffff;
  --ink: #1b2a36;
  --muted: #5d6b76;
  --line: #d9e0e5;
  --accent: #174e6b;
  --accent-soft: #e3eef4;
  --good: #17694a;
  --good-soft: #e2f2ea;
  --down: #a63a22;
  --down-soft: #fbe9e4;
  --warn: #8a6410;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12191f; --sheet: #1a242c; --ink: #e3e9ee; --muted: #94a3ae; --line: #2c3a45;
    --accent: #7db7d4; --accent-soft: #1d3240; --good: #6cc59a; --good-soft: #17302a;
    --down: #ec8c74; --down-soft: #3a2420; --warn: #e2b85a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12191f; --sheet: #1a242c; --ink: #e3e9ee; --muted: #94a3ae; --line: #2c3a45;
  --accent: #7db7d4; --accent-soft: #1d3240; --good: #6cc59a; --good-soft: #17302a;
  --down: #ec8c74; --down-soft: #3a2420; --warn: #e2b85a; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; text-wrap: balance; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.status { font-size: 13px; color: var(--muted); }
.status b { color: var(--ink); font-weight: 500; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; font: inherit; font-weight: 500; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--sheet); color: var(--ink); padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--sheet); }
.btn { border: 1px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--sheet); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: default; }
.list { display: grid; gap: 10px; }
.item { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; }
.item.dismissed { opacity: .55; }
.item-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.item-name { font-weight: 700; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.item-name a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
.item-name a:hover { border-bottom-color: var(--accent); }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.chip.rent { background: var(--accent-soft); color: var(--accent); }
.chip.buy { background: var(--accent-soft); color: var(--accent); }
.chip.disc { background: var(--good-soft); color: var(--good); font-weight: 500; }
.chip.down { background: var(--down-soft); color: var(--down); font-weight: 500; }
.chip.int { background: var(--good); color: var(--sheet); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.facts .price { color: var(--ink); font-weight: 500; font-size: 15px; }
.detail { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.empty { background: var(--sheet); border: 1px dashed var(--line); border-radius: 8px; padding: 20px; color: var(--muted); font-size: 14px; }
.note { font-size: 12.5px; color: var(--muted); }
.err { background: var(--down-soft); color: var(--down); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
.ok { color: var(--good); font-size: 13px; }
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
.delta-up { color: var(--down); } .delta-dn { color: var(--good); }
.chart svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
form { display: grid; gap: 16px; }
fieldset { border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); padding: 12px 14px 14px; margin: 0; display: grid; gap: 12px; min-width: 0; }
legend { font-weight: 700; padding: 0 6px; }
.sub { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 14px; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
label.f input, label.f select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { min-height: 64px; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.checks label { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px; cursor: pointer; background: var(--paper); }
.checks input:checked + span { color: var(--accent); font-weight: 500; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.savebar { position: sticky; bottom: 0; background: var(--paper); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.chip.newc { background: var(--accent); color: var(--sheet); font-weight: 500; }
.chip.fresh { background: var(--warn); color: var(--sheet); font-weight: 500; }
.chip.low { background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.day { display: grid; gap: 8px; }
.day h2 { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.trail { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.pre { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--paper); }
.pre button { border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; padding: 2px 10px; cursor: pointer; }
.pre button + button { color: var(--muted); padding-inline: 8px; border-left: 1px solid var(--line); }
.checks .rm { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 2px 4px 2px 10px; background: var(--accent-soft); }
.checks .rm button { border: 0; background: none; color: inherit; cursor: pointer; font: inherit; padding: 0 6px; }
.bar .grow { flex: 1 1 auto; }
label.inl { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
label.inl select { font: inherit; font-size: 13px; color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
@media (prefers-reduced-motion: no-preference) { .item { transition: opacity .2s; } }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum button { font: inherit; text-align: left; background: var(--accent-soft); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; color: var(--ink); cursor: pointer; min-width: 0; }
.sum button:hover { border-color: var(--accent); }
.sum small { display: block; font-size: 12px; color: var(--muted); }
.sum strong { font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.sum .sn strong { color: var(--good); } .sum .sd strong { color: var(--down); }
.sum .sdate { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); margin: 0; }
</style>

<style>html{-webkit-text-size-adjust:100%}body{margin:0}</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>物件相場ウォッチ<span class="note" style="font-weight:400">（家族用）</span></h1>
    <div class="status" id="status">読み込み中…</div>
  </div>
  <div id="pageErr" class="err" hidden></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tab-history" aria-selected="true" data-tab="history">通知履歴</button>
    <button role="tab" id="tab-browse" aria-selected="false" data-tab="browse">物件一覧</button>
    <button role="tab" id="tab-favs" aria-selected="false" data-tab="favs">気になる</button>
    <button role="tab" id="tab-market" aria-selected="false" data-tab="market">相場</button>
  </div>

  <section id="history" role="tabpanel" aria-labelledby="tab-history" style="display:grid;gap:12px">
    <div class="bar">
      <div class="seg" id="hKindSeg">
        <button type="button" data-k="all" aria-pressed="true">すべて</button>
        <button type="button" data-k="rent" aria-pressed="false">賃貸</button>
        <button type="button" data-k="buy" aria-pressed="false">売買</button>
      </div>
      <div class="seg" id="hTypeSeg">
        <button type="button" data-k="all" aria-pressed="true">新着と値下げ</button>
        <button type="button" data-k="new" aria-pressed="false">新着</button>
        <button type="button" data-k="down" aria-pressed="false">値下げ</button>
      </div>
      <button class="btn" type="button" id="reload">再読み込み</button>
    </div>
    <div class="sum" id="hSum"></div>
    <p class="note" id="hNote">メールで知らせた物件の履歴です。初回の基準登録（条件に合う物件を最初にまとめて記録した分）は、通知していないので載りません。条件に合う全件は「物件一覧」で探せます。</p>
    <div id="histList" style="display:grid;gap:18px"><div class="empty">履歴を読み込んでいます。</div></div>
  </section>

  <section id="browse" role="tabpanel" aria-labelledby="tab-browse" hidden style="display:grid;gap:12px">
    <div class="panel">
      <div class="bar">
        <div class="seg" id="qKindSeg">
          <button type="button" data-k="all" aria-pressed="true">すべて</button>
          <button type="button" data-k="rent" aria-pressed="false">賃貸</button>
          <button type="button" data-k="buy" aria-pressed="false">売買</button>
        </div>
        <label class="inl">状態
          <select id="qStatus">
            <option value="active">見送り以外</option>
            <option value="week">直近7日の新着</option>
            <option value="down">値下げあり</option>
            <option value="interested">気になる</option>
            <option value="dismissed">見送り</option>
            <option value="all">すべて</option>
          </select>
        </label>
        <label class="inl">並べ替え
          <select id="qSort"></select>
        </label>
      </div>
      <div class="sub">区</div>
      <div class="checks" id="qWards"></div>
      <div class="grid">
        <label class="f">最寄駅（入力して選ぶ）<input type="text" id="qStInput" list="qStList" autocomplete="off" placeholder="例：豊洲"></label>
        <label class="f">キーワード（物件名・住所）<input type="text" id="qText" autocomplete="off"></label>
        <label class="f">間取り<select id="qLayout"></select></label>
      </div>
      <datalist id="qStList"></datalist>
      <div class="checks" id="qStChips"></div>
      <div class="grid">
        <label class="f">価格 下限（万円）<input type="number" id="qPMin" min="0" step="1"></label>
        <label class="f">価格 上限（万円）<input type="number" id="qPMax" min="0" step="1"></label>
        <label class="f">面積 下限（㎡）<input type="number" id="qAMin" min="0" step="1"></label>
        <label class="f">面積 上限（㎡）<input type="number" id="qAMax" min="0" step="1"></label>
        <label class="f">竣工（年以降）<input type="number" id="qBuilt" min="1950" step="1"></label>
        <label class="f">駅徒歩（分以内）<input type="number" id="qWalk" min="1" step="1"></label>
      </div>
      <p class="note">価格は、賃貸は込み賃料の月額、売買は掲載価格を、どちらも万円で指定します。割安率は、同じ最寄駅・同じ築年帯の中央値（㎡単価）との比較です。定期借家・1階・借地権などの物件が安く出やすいので、参考値として見てください。</p>
      <div class="bar">
        <input type="text" id="qPreName" placeholder="保存する名前" aria-label="保存する条件の名前" style="font:inherit;font-size:13px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;flex:0 1 180px">
        <button class="btn" type="button" id="qPreSave">この条件を保存</button>
        <button class="btn" type="button" id="qReset">条件をクリア</button>
        <span id="qPresets" class="bar"></span>
      </div>
    </div>
    <div class="bar"><span class="status" id="qCount"></span></div>
    <div class="list" id="browseList"></div>
    <button class="btn" type="button" id="qMore" hidden>さらに表示</button>
  </section>

  <section id="favs" role="tabpanel" aria-labelledby="tab-favs" hidden style="display:grid;gap:12px">
    <div class="bar">
      <div class="seg" id="vKindSeg">
        <button type="button" data-k="all" aria-pressed="true">すべて</button>
        <button type="button" data-k="rent" aria-pressed="false">賃貸</button>
        <button type="button" data-k="buy" aria-pressed="false">売買</button>
      </div>
    </div>
    <div class="list" id="favList"></div>
  </section>

  <section id="market" role="tabpanel" aria-labelledby="tab-market" hidden style="display:grid;gap:14px">
    <div class="bar">
      <div class="seg" id="mKindSeg">
        <button type="button" data-k="rent" aria-pressed="true">賃貸</button>
        <button type="button" data-k="buy" aria-pressed="false">売買</button>
      </div>
      <label class="f" style="display:flex;gap:6px;align-items:center">築年帯
        <select id="mBand">
          <option value="all">すべて</option><option value="2016-">2016年〜</option><option value="2006-2015">2006〜2015年</option><option value="1982-2005">1982〜2005年</option><option value="-1981">〜1981年</option>
        </select>
      </label>
    </div>
    <div class="panel chart">
      <h2 id="chartTitle">区別の中央値の推移</h2>
      <div id="chart"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel">
      <h2 id="tableTitle">最新の相場</h2>
      <div class="tablewrap"><table id="mTable"><thead></thead><tbody></tbody></table></div>
      <p class="note" id="mNote"></p>
    </div>
  </section>

  <p class="note">この画面は家族用です。リンクは、家族以外に教えないでください。</p>
</div>

<script>
(() => {
  const SUPABASE_URL = 'https://ecthbmwteboumrxiwmof.supabase.co';
  const ANON_KEY = 'sb_publishable_HmNpJ9DBuN4DGbYE0rzsbA_4JPNIy2e';   // 公開してよいキー。データは、リンクの合言葉がなければ読めない
  const BANDS = { 'all': 'すべて', '2016-': '2016年〜', '2006-2015': '2006〜15年', '1982-2005': '1982〜2005年', '-1981': '〜1981年', '不明': '不明' };
  const COLORS = ['var(--accent)', 'var(--good)', 'var(--down)', 'var(--warn)', 'var(--muted)', 'var(--ink)'];
  const $ = (id) => document.getElementById(id);
  const state = { me: '', listings: [], events: [], byCode: new Map(), evByCode: new Map(), lastVisit: null, stats: [], mKind: 'rent' };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const yen = (n) => n == null ? '—' : Number(n).toLocaleString('ja-JP');
  const manYen = (n) => { n = Number(n); if (!n) return '—'; if (n >= 1e8) { const o = Math.floor(n / 1e8), m = Math.round((n % 1e8) / 1e4); return o + '億' + (m ? m.toLocaleString('ja-JP') + '万' : '') + '円'; } return (n / 1e4).toLocaleString('ja-JP', { maximumFractionDigits: 1 }) + '万円'; };
  const unitText = (kind, u) => u == null ? '—' : kind === 'rent' ? Math.round(u).toLocaleString('ja-JP') + '円/㎡' : (u * 3.30579 / 1e4).toFixed(0) + '万円/坪';

  function showErr(where, e) {
    const code = e && e.code;
    const msg = code === 'forbidden' ? 'このリンクでは開けません。合言葉が違うか、無効になっています。リンクを送ってくれた人に、新しいリンクをもらってください。'
      : code === 'no_token' ? 'リンクの末尾（# から後ろ）が欠けています。送ってもらったリンクを、そのまま開いてください。'
      : code === 'network' ? '通信できませんでした。電波の状態を確認して、再読み込みしてください。'
      : `読み込めませんでした（${String((e && e.message) || code || 'error').slice(0, 160)}）。`;
    const box = where || $('pageErr'); box.textContent = msg; box.hidden = false; box.className = 'err';
  }

  // 合言葉は、リンクの末尾（#k=…）から取り、この端末に覚えておく（次からは、末尾がなくても開ける）
  const TOKEN = (() => {
    let t = '';
    try { const m = (location.hash || '').match(/[#&]k=([0-9a-f]{16,128})/); if (m) { t = m[1]; localStorage.setItem('ew-family-token', t); } } catch {}
    if (!t) { try { t = localStorage.getItem('ew-family-token') || ''; } catch {} }
    return t;
  })();
  async function rpc(fn, args) {
    if (!TOKEN) throw { code: 'no_token' };
    let r;
    try { r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: ANON_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_token: TOKEN, ...args }) }); }
    catch { throw { code: 'network' }; }
    if (!r.ok) { const t = await r.text().catch(() => ''); throw { code: (r.status === 400 && /forbidden/.test(t)) || r.status === 401 || r.status === 403 ? 'forbidden' : 'http', message: `${r.status} ${t.slice(0, 120)}` }; }
    return r.json();
  }

  // ---------- tabs ----------
  const TABS = ['history', 'browse', 'favs', 'market'];
  document.querySelectorAll('[role=tab]').forEach((b) => b.addEventListener('click', () => selectTab(b.dataset.tab)));
  function selectTab(t) {
    document.querySelectorAll('[role=tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
    TABS.forEach((id) => { $(id).hidden = id !== t; });
    try { localStorage.setItem('ew-tab', t); } catch {}
  }
  try { const t = localStorage.getItem('ew-tab') || (location.hash || '').slice(1); if (TABS.includes(t)) selectTab(t); } catch {}
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // ---------- shared: listings ----------
  const stName = (s) => { s = String(s || ''); const m = s.match(/「(.+?)」/) || s.match(/\/(.+?駅)/); return m ? m[1].replace(/駅$/, '') : ''; };
  const baseLayout = (l) => String(l || '').replace(/[+（(].*$/, '');

    const lrows = state.stats.filter((s) => s.kind === k && s.run_date === latest && (band === 'all' ? true : s.band === band))

      return `<tr><td>${esc(s.ward)}</td><td>${esc(BANDS[s.band] || s.band)}</td><td class="num">${s.n}</td><td class="num">${k === 'rent' ? Math.round(val(s)).toLocaleString('ja-JP') : val(s).toFixed(0)}</td><td class="num">${k === 'rent' ? Math.round(p25).toLocaleString('ja-JP') : p25.toFixed(0)}</td><td class="num">${k === 'rent' ? yen(s.median_price) + '円' : manYen(s.median_price)}</td><td class="num ${ch > 0 ? 'delta-up' : ch < 0 ? 'delta-dn' : ''}">${ch == null ? '—' : (ch > 0 ? '+' : '') + ch.toFixed(1) + '%'}</td></tr>`;
    }).join('');
    $('mNote').textContent = k === 'rent' ? '賃貸はSUUMOの掲載物件（重複掲載をまとめた後）の管理費込み月額の㎡単価です。' : '売買はSUUMOの中古マンション掲載価格（成約価格ではありません）を坪単価にしたものです。';
  }
  $('mKindSeg').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; state.mKind = b.dataset.k; $('mKindSeg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderMarket(); });
  $('mBand').addEventListener('change', renderMarket);

  // ---------- load ----------
  function updateStatusBar() {
    const lastRun = state.stats.length ? state.stats[state.stats.length - 1].run_date : null;
    const fav = state.listings.filter((r) => r.status === 'interested').length;
    $('status').innerHTML = `最終集計 <b class="num">${lastRun || '—'}</b>・登録 <b class="num">${state.listings.length}</b>件・気になる <b class="num">${fav}</b>件`;
  }
  async function loadAll() {
    $('pageErr').hidden = true;
    try {
      const d = await rpc('estate_family_data', {});
      state.me = d.me || '';
      state.listings = (d.listings || []).map(normListing);
      state.events = (d.events || []).map((e) => ({ ...e, id: Number(e.id), price: toNum(e.price), prev_price: toNum(e.prev_price) }));
      state.stats = d.stats || [];
      state.byCode = new Map(state.listings.map((r) => [r.code, r]));
      state.evByCode = new Map(); state.events.forEach((e) => { if (!state.evByCode.has(e.code)) state.evByCode.set(e.code, []); state.evByCode.get(e.code).push(e); });
      state.lastVisit = store.get('ew-last', null);
      buildFilterControls(); renderAll(); renderMarket(); updateStatusBar();
      store.set('ew-last', todayJ());
    } catch (e) { showErr(null, e); $('status').textContent = '読み込めませんでした'; }
  }
  $('reload').addEventListener('click', loadAll);

  loadAll();
})();
</script>
</body>
</html>
